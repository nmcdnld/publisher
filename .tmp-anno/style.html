  <style>
    :root {
      --ink: #16181d;
      --ink-2: #4a505c;
      --ink-3: #7b8190;
      --rule: #e3e5ea;
      --wash: #f6f7f9;
      --accent: #1f6feb;
      --accent-wash: #eaf2ff;
      --warn: #9a6700;
      --warn-wash: #fff8e1;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", "Charter", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font: 16px/1.6 var(--sans);
      background: #fff;
    }

    .page {
      display: grid;
      grid-template-columns: 220px minmax(0, 760px);
      gap: 56px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 32px 120px;
    }

    nav.toc {
      position: sticky;
      top: 32px;
      align-self: start;
      font-size: 13px;
    }

    nav.toc .label {
      font: 600 11px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 12px;
    }

    nav.toc ol {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: toc;
    }

    nav.toc li {
      counter-increment: toc;
      margin: 0 0 8px;
    }

    nav.toc a {
      color: var(--ink-2);
      text-decoration: none;
    }

    nav.toc li a::before {
      content: counter(toc, decimal-leading-zero);
      font-family: var(--mono);
      color: var(--ink-3);
      margin-right: 8px;
    }

    nav.toc a:hover {
      color: var(--accent);
    }

    nav.toc .series {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }

    nav.toc .series a {
      display: block;
      padding: 5px 0 5px 10px;
      border-left: 2px solid var(--rule);
      line-height: 1.35;
    }

    nav.toc .series a b {
      display: block;
      font: 600 10.5px/1.5 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    nav.toc .series a[aria-current] {
      border-left-color: var(--accent);
      color: var(--ink);
    }

    nav.toc .series a[aria-current] b {
      color: var(--accent);
    }

    main {
      min-width: 0;
    }

    .series-foot {
      margin-top: 88px;
      padding-top: 28px;
      border-top: 1px solid var(--rule);
    }

    .series-foot .label {
      font: 600 11px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .series-foot .card {
      display: block;
      margin-top: 14px;
      padding: 18px 22px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
      background: var(--wash);
    }

    .series-foot .card:hover {
      border-color: var(--accent);
    }

    .series-foot .card .eyebrow {
      font: 600 11px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .series-foot .card .title {
      display: block;
      font: 600 22px/1.25 var(--serif);
      margin: 8px 0 6px;
    }

    .series-foot .card .blurb {
      display: block;
      font-size: 15px;
      color: var(--ink-2);
    }

    .series-foot .colophon {
      font: 12px/1.5 var(--mono);
      color: var(--ink-3);
      margin-top: 18px;
    }

    header .kicker {
      font: 600 12px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font: 600 44px/1.1 var(--serif);
      letter-spacing: -.01em;
      margin: 14px 0 16px;
    }

    .dek {
      font-size: 19px;
      color: var(--ink-2);
      margin: 0 0 20px;
    }

    .byline {
      font: 12px/1.5 var(--mono);
      color: var(--ink-3);
    }

    h2 {
      font: 600 28px/1.2 var(--serif);
      margin: 72px 0 8px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
    }

    h2 .num {
      font: 500 14px var(--mono);
      color: var(--ink-3);
      margin-right: 10px;
      vertical-align: 4px;
    }

    h3 {
      font-size: 17px;
      margin: 36px 0 6px;
    }

    .lede {
      color: var(--ink-2);
      font-size: 17px;
      margin-top: 0;
    }

    a {
      color: var(--accent);
    }

    code {
      font: 13.5px var(--mono);
      background: var(--wash);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 0 4px;
    }

    pre {
      font: 13px/1.55 var(--mono);
      background: #0f1115;
      color: #e6e8ee;
      border-radius: 8px;
      padding: 16px 18px;
      overflow-x: auto;
    }

    pre .c {
      color: #7d8597;
    }

    .tldr {
      background: var(--accent-wash);
      border: 1px solid #cfe0ff;
      border-radius: 10px;
      padding: 18px 22px;
      margin: 32px 0 0;
    }

    .tldr strong.label {
      display: block;
      font: 600 11px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .tldr ul {
      margin: 0;
      padding-left: 18px;
    }

    .tldr li {
      margin: 4px 0;
    }

    .ed {
      background: var(--warn-wash);
      border-left: 3px solid #e3b341;
      padding: 10px 14px;
      margin: 16px 0;
      font-size: 14px;
      color: var(--warn);
    }

    .ed::before {
      content: "Editor: ";
      font-weight: 600;
    }

    figure {
      margin: 28px 0;
    }

    figure.wide {
      margin-left: -60px;
      margin-right: -60px;
    }

    figure img {
      width: 100%;
      display: block;
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    }

    figcaption {
      font-size: 13.5px;
      color: var(--ink-2);
      margin-top: 10px;
      line-height: 1.5;
    }

    figcaption b {
      color: var(--ink);
    }

    figcaption .src {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-3);
    }

    .pair,
    .trio {
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: 28px 0;
    }

    .pair figure,
    .trio figure {
      margin: 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
      margin: 16px 0;
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }

    th {
      font: 600 11px var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .callout {
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 14px 18px;
      background: var(--wash);
      font-size: 15px;
      margin: 20px 0;
    }

    /* The flow diagrams */
    .flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin: 24px 0;
      font-size: 13px;
      flex-wrap: wrap;
      row-gap: 12px;
    }

    .flow .node {
      flex: 1 1 0;
      min-width: 120px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    .flow .node b {
      display: block;
      font-size: 13.5px;
      margin-bottom: 2px;
    }

    .flow .node span {
      color: var(--ink-2);
    }

    .flow .node.hl {
      border-color: #9ec1ff;
      background: var(--accent-wash);
    }

    .flow .arrow {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      font-family: var(--mono);
    }

    .loop {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 24px 0;
      position: relative;
    }

    .loop .node {
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
      font-size: 13px;
    }

    .loop .node .step {
      font: 600 11px var(--mono);
      color: var(--accent);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .loop .node b {
      display: block;
      font-size: 14px;
      margin: 4px 0;
    }

    .loop .node span {
      color: var(--ink-2);
    }

    .loop .node.future {
      border-style: dashed;
      background: var(--wash);
    }

    .loop-back {
      font: 12px var(--mono);
      color: var(--ink-3);
      text-align: center;
      margin-top: -4px;
    }

    .tag {
      display: inline-block;
      font: 600 10.5px var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      vertical-align: 2px;
    }

    .tag.now {
      background: #dafbe1;
      color: #1a7f37;
    }

    .tag.next {
      background: #fff1c2;
      color: #9a6700;
    }

    .tag.later {
      background: #eef0f4;
      color: var(--ink-2);
    }

    @media (max-width: 960px) {
      .page {
        grid-template-columns: 1fr;
        gap: 0;
      }

      nav.toc {
        display: none;
      }

      figure.wide,
      .trio {
        margin-left: 0;
        margin-right: 0;
      }

      .pair,
      .trio,
      .loop {
        grid-template-columns: 1fr;
      }
    }
  </style>
